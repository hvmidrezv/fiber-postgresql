version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fiber-postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: books_db
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fiber-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiber-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_NAME: books_db
      DB_SSLMODE: disable
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fiber-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  fiber-network:
    driver: bridge

